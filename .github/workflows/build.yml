name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build DeskTodo.csproj -c Release

      - name: Publish self-contained
        run: >
          dotnet publish DeskTodo.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=None
          -o dist/selfcontained

      - name: Publish lite
        run: >
          dotnet publish DeskTodo.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None
          -o dist/lite

      - uses: actions/upload-artifact@v4
        with:
          name: DeskTodo-win-x64
          path: |
            dist/selfcontained/DeskTodo.exe
            dist/lite/DeskTodo.exe
